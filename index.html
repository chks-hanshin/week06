<html>
  <head>
    <style>
      p {
        color: red;
      }

      h1 {
        color: red;
        background-color: yellow;
      }
      .good {
        color: blue;
      }
      #good {
        color: green;
      }
      siu {
        font-weight: bold;
        color: #FF00FF;
      }
    </style>
  </head>
  <body>
    <h1>소개 하다</h1>
    <p>안녕하세요</p>
    <p class="good">이건 파란색 입니다</p>
    <p class="good" id="good">#은 .을 이깁니다.</p>
  </body>
  <siu>
    <p>body를 쓰지 않은 문단</p>
    <h1>헤더1</h1>
    <form>
      <fieldset>
      <table>
        <legend>개인정보 입력</legend>
        <tr>
            <td><label for="name">이름</label></td>
            <td><input type="text" id="name" name="name" required></td>
        </tr>
        <tr>
            <td><label for="tel">전화번호</label></td>
            <td><input type="tel" id="tel" name="tel" placeholder="전화번호 입력"></td>
        </tr>
      </table>
      <button type="submit">제출</button>
      <button type="reset">초기화</button>
      </fieldset>
    </form>
  </siu>
</html>
